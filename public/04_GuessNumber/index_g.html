<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess a Random Number</title>
  <script src="guess.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0e1d48, #a0156d, #3ca666);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
    }

    .palate {
      background-color: #ffffff98;
      color: #222;
      width: 90%;
      max-width: 400px;
      padding: 30px 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    h2 {
      font-size: 26px;
      margin-bottom: 20px;
      color: #333;
    }

    input[type="number"] {
      padding: 10px;
      width: 80%;
      border: 1px solid #aaa;
      border-radius: 8px;
      font-size: 18px;
      margin-bottom: 15px;
    }

    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 25px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #388e3c;
    }

    #feedback {
      margin-top: 20px;
      font-weight: bold;
      font-size: 18px;
      color: #444;
    }
    .navbar {
  position: absolute;
  top: 20px;
  right: 30px;
  padding: 0.1em;
  
}

  </style>
</head>
<body>

  <div class="navbar">
    <button class="button" onclick="location.href='../index.html'">Home</button>
    </div>

   
  </div>

  <div class="palate">

    

    <h2>Guess a Number (1–100)</h2>
    <input type="number" id="guess" placeholder="Enter your guess" />
    <br />
    <button  type="button" onclick="checkGuess()">Submit</button>
    <div id="feedback"></div>
  </div>


</body>
</html>
