<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Local Time</title>
  <script src="timer.js" defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f0f0f, #1a1a1a);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .navbar {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 15px;
    }

    .button {
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      background: linear-gradient(45deg, #ff0057, #ff7b00);
      color: #fff;
      box-shadow: 0 4px 15px rgba(255, 0, 87, 0.5);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 20px #ff0057, 0 0 40px #ff7b00;
    }

    h2 {
      font-size: 32px;
      margin-bottom: 15px;
      letter-spacing: 1.2px;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    #clock {
      font-size: 64px;
      font-weight: bold;
      color: #0f0f0f;
      background: linear-gradient(45deg, #00ffcc, #00bfff);
      padding: 25px 60px;
      border-radius: 25px;
      box-shadow:
        0 0 15px #00ffe1,
        0 0 40px #00eaff,
        0 0 60px #00ffea;
      transition: all 0.3s ease-in-out;
      animation: pulse 2s infinite ease-in-out;
    }

    #clock:hover {
      transform: scale(1.05);
      box-shadow:
        0 0 20px #00ffe1,
        0 0 50px #00eaff,
        0 0 80px #00ffea;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow:
          0 0 15px #00ffe1,
          0 0 40px #00eaff,
          0 0 60px #00ffea;
      }
      50% {
        box-shadow:
          0 0 25px #00ffe1,
          0 0 60px #00eaff,
          0 0 90px #00ffea;
      }
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button class="button" onclick="location.href='../index.html'">Home</button>
    </div>
  </div>

  <h2>Your Local Time</h2>
  <div id="clock">00:00:00</div>

</body>
</html>
